name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libsqlite3-dev libsecret-1-dev \
            xvfb

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get
      - run: flutter test --no-pub --timeout 60s
      - run: flutter build linux --release --no-pub

      # Still running after 15 seconds counts as started; timeout exits 124.
      - name: Check that it starts
        working-directory: build/linux/x64/release/bundle
        run: |
          status=0
          timeout 15 xvfb-run -a ./cloud_iptv || status=$?
          test "$status" -eq 124

      - name: Attach to the release
        run: |
          tar -czf CloudIPTV-linux-x64.tar.gz \
            -C build/linux/x64/release --transform 's/^bundle/cloud-iptv/' bundle
          gh release upload "$TAG" CloudIPTV-linux-x64.tar.gz --clobber
